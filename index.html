<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DFQuestionnaireV1</title>
    <base href="/DFQuestionnaire-/" />
    <script>
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>

    <!-- Base styles first -->
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />

    <!--fluent  ui-->
    <script type="module" src="_content/Microsoft.FluentUI.AspNetCore.Components/fluent-ui-components.min.js"></script>


    <!-- Blazor CSS isolation bundle (from *.razor.css) -->

    <!-- Your global overrides LAST so they win -->
    <link rel="stylesheet" href="css/app.css" />

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        function fitQuadrantText() {
            requestAnimationFrame(() => {
                document.querySelectorAll('.quadrant-message').forEach(msg => {
                    // Reset to CSS-defined size first
                    msg.style.fontSize = '';

                    let fontSize = parseFloat(window.getComputedStyle(msg).fontSize);
                    while (msg.scrollHeight > msg.clientHeight && fontSize > 8) {
                        fontSize -= 0.5;
                        msg.style.fontSize = fontSize + 'px';
                    }
                });
            });
        }
    </script>
</body>
